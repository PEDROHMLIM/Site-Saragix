<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="1200" height="400" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500&amp;display=swap');
      .title {
        font-family: 'Instrument Serif', Georgia, serif;
        font-size: 58px;
        fill: #ffffff;
        letter-spacing: -0.01em;
      }
      .subtitle {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 17px;
        fill: #71717a;
        letter-spacing: 0.01em;
      }
    </style>
  </defs>

  <!-- Container Ícone -->
  <g transform="translate(48, 46)">
    <rect width="108" height="108" rx="24" fill="#141418" stroke="#26262f" stroke-width="2" />
    
    <!-- Ícone Geométrico 120x120 escalado -->
    <g transform="translate(18, 18) scale(0.6)">
      <polygon points="60,12 96,32 60,52 24,32" fill="#e4e4e7" />
      <polygon points="24,32 60,52 60,74 24,54" fill="#52525b" />
      <polygon points="24,54 60,34 96,54 60,74" fill="#a1a1aa" />
      <polygon points="96,54 96,78 60,98 60,74" fill="#3f3f46" />
      <polygon points="60,68 96,88 60,108 24,88" fill="#71717a" />
      <rect x="55" y="27" width="10" height="10" transform="rotate(45 60 32)" fill="#18181b" />
      <rect x="55" y="83" width="10" height="10" transform="rotate(45 60 88)" fill="#e4e4e7" />
    </g>
  </g>

  <!-- Tipografia -->
  <text x="184" y="102" class="title">Saragix</text>
  <text x="186" y="138" class="subtitle">Sua história, lance por lance.</text>
</svg>
